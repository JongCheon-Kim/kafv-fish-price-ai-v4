function firstField(r,keys){for(const k of keys){const v=r?.[k];if(v!==undefined&&v!==null&&String(v).trim()!=="")return String(v).trim()}return ""}

function uniqueOptions(rows,codeKeys,nameKeys,metaKeys=[]){const m=new Map();for(const r of rows){const c=firstField(r,Array.isArray(codeKeys)?codeKeys:[codeKeys]);const n=firstField(r,Array.isArray(nameKeys)?nameKeys:[nameKeys]);if(!n)continue;const key=c||n;const meta=metaKeys.length?firstField(r,metaKeys):"";if(!m.has(key))m.set(key,option(c||n,n,meta))}return [...m.values()].sort((a,b)=>a.name.localeCompare(b.name,"ko"))}
function filterRows(rows,criteria={}){return rows.filter(r=>Object.entries(criteria).every(([k,v])=>!v||String(r[k]??"")===String(v)))}

function unitFacet(rows){const vals=[...new Set(rows.map(r=>firstField(r,["unit","unit_nm"])).filter(Boolean))];return vals.sort((a,b)=>a.localeCompare(b,"ko")).map(v=>option(v,v))}

async function api(path,params={}){
  const u=new URL(API_BASE+path);
  Object.entries(params).forEach(([k,v])=>{if(v!==""&&v!==null&&v!==undefined)u.searchParams.set(k,v)});
  let r;
  try{r=await fetch(u,{headers:{Accept:"application/json"}})}catch(e){
    throw new Error(`Worker 연결 실패(CORS/배포 확인): ${e?.message||e}`);
  }
  if(!r.ok){let detail="";try{detail=(await r.clone().text()).slice(0,180)}catch{};throw new Error(`Worker HTTP ${r.status}${detail?` · ${detail}`:""}`)}
  const t=await r.text();try{return JSON.parse(t)}catch{return t}
}
async function apiAll(path,params={},rowsPerPage=1000,maxPages=30){const out=[],seenPages=new Set();let total=null;for(let page=1;page<=maxPages;page++){const q={...params,numOfRows:rowsPerPage,pageNo:page,returnType:params.returnType||"json"};const raw=await api(path,q);const {body,items}=itemsOf(raw);const sig=items.length?JSON.stringify([items.length,items[0],items[items.length-1]]):"EMPTY";if(seenPages.has(sig))break;seenPages.add(sig);out.push(...items);const tc=Number(body?.totalCount??body?.total_count??NaN);if(Number.isFinite(tc))total=tc;if(!items.length||items.length<rowsPerPage||(total!==null&&out.length>=total))break}return out}
function cond(o){const p={numOfRows:1000,pageNo:1,returnType:"json"};Object.entries(o).forEach(([k,v])=>{if(v!==""&&v!==null&&v!==undefined)p[`cond[${k}]`]=v});return p}

function wirePicker(id,loader,onSelect){
  const w=document.getElementById(id+"Wrap"),inp=document.getElementById(id);if(!w||!inp)return;
  const panel=w.querySelector(".pick-panel"),list=w.querySelector(".pick-list"),arrow=w.querySelector(".pick-arrow"),inputArea=w.querySelector(".pick-input");
  let options=[],loaded=false,loading=false;

  const normalizeOptions=(rows=[])=>{
    const m=new Map();
    for(const x of rows||[]){
      if(!x)continue;
      const code=String(x.code??x.name??"").trim();
      const name=String(x.name??x.code??"").trim();
      if(!code||!name)continue;
      const key=code+"|"+name;
      if(!m.has(key))m.set(key,{...x,code,name});
    }
    return [...m.values()];
  };

  const render=()=>{
    const selected=inp.dataset.code||"";
    list.innerHTML=options.length
      ?`<div class="pick-count">선택항목 ${options.length}개 · 스크롤바를 잡아 위·아래로 드래그하십시오.</div>`+
       options.map((o,i)=>`<button type="button" class="pick-opt ${o.code===selected?"selected":""}" data-i="${i}"><b>${esc(o.name)}</b><small>${esc(o.meta||o.code)}</small></button>`).join("")
      :`<div class="pick-empty">선택 가능한 항목이 없습니다. 상위 항목을 다시 선택하거나 API 연결을 확인하십시오.</div>`;
    list.querySelectorAll(".pick-opt").forEach((b,idx)=>b.addEventListener("click",ev=>{
      ev.preventDefault();ev.stopPropagation();
      const o=options[idx];
      inp.value=o.name;inp.dataset.code=o.code;
      close();
      if(onSelect)onSelect(o);
    }));
  };

  const load=async(force=false)=>{
    if((loaded&&!force)||loading)return;
    loading=true;
    list.innerHTML=`<div class="pick-empty">목록 불러오는 중...</div>`;
    try{
      options=normalizeOptions(await loader());
      loaded=true;
      render();
    }catch(e){
      loaded=false;
      list.innerHTML=`<div class="pick-empty err">목록 불러오기 실패: ${esc(e.message||e)}<br>화살표를 다시 눌러 재시도하십시오.</div>`;
    }finally{loading=false}
  };

  const open=async()=>{
    document.querySelectorAll(".pick-panel.on").forEach(p=>{
      if(p!==panel){
        p.classList.remove("on");
        p.closest(".picker")?.classList.remove("opened");
        const a=p.parentElement?.querySelector(".pick-arrow");
        if(a){a.classList.remove("open");a.setAttribute("aria-expanded","false")}
      }
    });
    panel.classList.add("on");w.classList.add("opened");
    arrow.classList.add("open");arrow.setAttribute("aria-expanded","true");
    await load();
    if(loaded)render();
  };

  const close=()=>{
    panel.classList.remove("on");w.classList.remove("opened");
    arrow.classList.remove("open");arrow.setAttribute("aria-expanded","false");
  };

  const toggle=async ev=>{ev.preventDefault();ev.stopPropagation();panel.classList.contains("on")?close():await open()};
  arrow.addEventListener("click",toggle);
  inp.addEventListener("click",toggle);

  // PC에서는 선택란에 마우스를 올려도 탑다운 목록을 열 수 있다.
  inputArea.addEventListener("mouseenter",()=>{
    if(window.matchMedia("(hover:hover)").matches&&!panel.classList.contains("on"))open();
  });

  // 목록 안에서는 닫히지 않는다. 선택하거나 바깥을 클릭할 때만 닫는다.
  ["click","mousedown","pointerdown"].forEach(evt=>panel.addEventListener(evt,ev=>ev.stopPropagation()));
  panel.addEventListener("touchstart",ev=>ev.stopPropagation(),{passive:true});
  list.addEventListener("wheel",ev=>ev.stopPropagation(),{passive:true});
  document.addEventListener("click",ev=>{if(!w.contains(ev.target))close()});

  w.resetPicker=()=>{
    options=[];loaded=false;loading=false;inp.value="";inp.dataset.code="";
    list.innerHTML=`<div class="pick-empty">오른쪽 ▼를 눌러 항목을 펼치십시오.</div>`;close();
  };
  w.reloadPicker=()=>{
    loaded=false;options=[];
    list.innerHTML=`<div class="pick-empty">오른쪽 ▼를 눌러 항목을 다시 불러오십시오.</div>`;
  };
  w.openPicker=open;
}

function readCachedPriceCatalog(){
  try{
    const raw=JSON.parse(localStorage.getItem(PRICE_CATALOG_STORAGE_KEY)||"[]");
    if(!Array.isArray(raw))return [];
    return raw.filter(x=>x&&x.code&&x.name).map(x=>option(x.code,x.name,x.meta||""));
  }catch{return []}
}
function savePriceCatalog(rows){
  try{localStorage.setItem(PRICE_CATALOG_STORAGE_KEY,JSON.stringify(rows.map(x=>({code:x.code,name:x.name,meta:x.meta||""}))))}catch{}
}
function collectPriceItems(map,rows){
  for(const r of rows||[]){
    const c=firstField(r,["item_cd"]),n=firstField(r,["item_nm"]);
    const cat=firstField(r,["ctgry_cd"]);
    if(c&&n&&(!cat||cat===PRICE_CATEGORY))map.set(c,option(c,n));
  }
}
async function priceFishOptions(force=false){
  if(cache.priceFish&&!force)return cache.priceFish;
  // v3: 공식 코드사전을 기본으로 유지하되, 최근 수산가격 응답에 실제 존재하는 품목도 합친다.
  // 특정 거래일 0건 때문에 품목목록이 사라지지 않으면서 v1의 넓은 품목 포착력을 복원한다.
  const map=new Map(priceItemOptions().map(o=>[o.code,o]));
  try{
    const rows=await apiAll("/api/recent",cond({"ctgry_cd::EQ":PRICE_CATEGORY}),1000,8);
    collectPriceItems(map,rows);
  }catch(e){}
  cache.priceFish=[...map.values()].sort((a,b)=>a.name.localeCompare(b.name,"ko"));
  savePriceCatalog(cache.priceFish);
  return cache.priceFish;
}

function searchMetaHtml(meta){
  if(!meta)return "";
  const relaxed=(meta.relaxedParams||[]).map(x=>RELAX_LABEL[x]||x);
  if(meta.exact&&!relaxed.length&&!meta.dateAdjustment)return `<div class="source"><span class="badge ok">정확조건</span> 선택조건과 일치하는 실제 API 자료입니다.</div>`;
  const parts=[];
  if(relaxed.length)parts.push(`${relaxed.join(" → ")} 조건 완화`);
  if(meta.dateAdjustment)parts.push(meta.dateAdjustment);
  const why=parts.length?parts.join(" · "):"검색범위 확대";
  return `<div class="source"><span class="badge warn">자동확대 검색</span> 정확조건 0건으로 ${esc(why)} 후 실제 자료를 찾았습니다. 품목 자체는 변경하지 않습니다.</div>`;
}

async function rowsForFacet(mode){
  const d=currentDetail();let path="/api/recent",extra={},key="";

  if(mode==="pwh"||mode==="prt"){path=mode==="pwh"?"/api/wholesale":"/api/retail";extra={"exmn_ymd::GTE":d8(getVal("fStart")),"exmn_ymd::LTE":d8(getVal("fEnd"))}}

}
async function rowsForUnitSize(mode){
  let rows=[];
  try{rows=await rowsForFacet(mode)}catch(e){}
  if(rows.length){absorbPriceFacets(rows);return rows}
  const d=currentDetail();
  const candidates=[];
  const add=p=>{const key=JSON.stringify(p);if(!candidates.some(x=>JSON.stringify(x)===key))candidates.push(p)};
  const base={"ctgry_cd::EQ":PRICE_CATEGORY};
  if(d.item)base["item_cd::EQ"]=d.item;
  const stage=d.se||(mode==="pwh"?"02":mode==="prt"?"01":"");
  if(stage)base["se_cd::EQ"]=stage;
  if(d.vr)base["vrty_cd::EQ"]=d.vr;
  if(d.gr)base["grd_cd::EQ"]=d.gr;
  add({...base});
  if(base["grd_cd::EQ"]){const p={...base};delete p["grd_cd::EQ"];add(p)}
  if(base["vrty_cd::EQ"]){const p={...base};delete p["grd_cd::EQ"];delete p["vrty_cd::EQ"];add(p)}
  if(base["se_cd::EQ"]){const p={...base};delete p["grd_cd::EQ"];delete p["vrty_cd::EQ"];delete p["se_cd::EQ"];add(p)}
  if(d.item)add({"ctgry_cd::EQ":PRICE_CATEGORY,"item_cd::EQ":d.item});
  add({"ctgry_cd::EQ":PRICE_CATEGORY});
  for(const p of candidates){
    try{
      rows=await priceRows("/api/recent",p,`unit-fallback|${mode}|${JSON.stringify(p)}`);
      if(rows.length){absorbPriceFacets(rows);return rows}
    }catch(e){}
  }
  return []
}

function overviewAliases(name){
  const base=String(name||"").trim();const map={"물오징어":["물오징어","오징어"],"마른오징어":["마른오징어","오징어"],"건다시마":["건다시마","다시마"],"마른미역":["마른미역","미역"],"염장미역":["염장미역","미역"],"마른멸치":["마른멸치","멸치"],"고등어필렛":["고등어필렛","고등어"],"수입조기":["수입조기","조기","부세"]};return [...new Set([base,...(map[base]||[])].filter(Boolean))];
}
function normName(s){return String(s||"").replace(/[\s()\[\]·.,\-_/]/g,"").toLowerCase()}
function auctionCandidatesForItem(itemName){
  const aliases=overviewAliases(itemName).map(normName).filter(Boolean),all=[];
  const score=(name)=>{const n=normName(name);let best=0;for(const a of aliases){if(n===a)best=Math.max(best,100);else if(n.includes(a))best=Math.max(best,70);else if(a.includes(n)&&n.length>=2)best=Math.max(best,55)}return best};
  for(const x of AUCTION_CODEBOOK.mid||[]){const s=score(x.name);if(s)all.push({kind:"mid",score:s,large:x.large,mid:x.code,name:x.name})}
  for(const x of AUCTION_CODEBOOK.small||[]){const s=score(x.name);if(s)all.push({kind:"small",score:s,large:x.large,mid:x.mid,small:x.code,name:x.name})}
  const seen=new Set();return all.sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name,"ko")).filter(x=>{const k=[x.large,x.mid,x.small||""].join("|");if(seen.has(k))return false;seen.add(k);return true}).slice(0,3);
}

  const match=(...vals)=>!q||vals.some(v=>String(v||"").toLowerCase().includes(q));
  for(const m of AUCTION_CODEBOOK.markets){if(match(m.name,m.code))rows.push({kind:"auctionMarket",code:m.code,title:m.name,desc:`경매 도매시장 · ${m.code}`})}
  for(const c of AUCTION_CODEBOOK.corps){const mn=AUCTION_CODEBOOK.markets.find(m=>m.code===c.market)?.name||c.market||"";if(match(mn,c.name,c.code))rows.push({kind:"auctionCorp",market:c.market||"",code:c.code,title:mn?`${mn} › ${c.name}`:c.name,desc:`경매 법인 · ${c.code}`})}
  for(const l of AUCTION_CODEBOOK.large){if(match(l.name,l.code))rows.push({kind:"auctionLarge",code:l.code,title:l.name,desc:`경매 상품 대분류 · ${l.code}`})}
  for(const m of AUCTION_CODEBOOK.mid){const ln=AUCTION_CODEBOOK.large.find(l=>l.code===m.large)?.name||m.large;if(match(ln,m.name,m.code))rows.push({kind:"auctionMid",large:m.large,code:m.code,title:`${ln} › ${m.name}`,desc:`경매 상품 중분류 · ${m.large}/${m.code}`})}
  for(const x of AUCTION_CODEBOOK.small){const ln=AUCTION_CODEBOOK.large.find(l=>l.code===x.large)?.name||x.large;const mn=AUCTION_CODEBOOK.mid.find(m=>m.large===x.large&&m.code===x.mid)?.name||x.mid;if(match(ln,mn,x.name,x.code))rows.push({kind:"auctionSmall",large:x.large,mid:x.mid,code:x.code,title:`${ln} › ${mn} › ${x.name}`,desc:`경매 상품 소분류 · ${x.large}/${x.mid}/${x.code}`})}
  return rows;
}
async function warmMainUnitSize(force=false){
  if(!force&&(cache.mainUnits?.length&&cache.mainSizes?.length))return;
  let gathered=[];
  try{gathered=await apiAll("/api/recent",cond({"ctgry_cd::EQ":PRICE_CATEGORY}),1000,8)}catch(e){}
  if(gathered.length)absorbPriceFacets(gathered);
  if(!(cache.mainUnits?.length&&cache.mainSizes?.length)){
    for(const item of PRICE_CODEBOOK.items){
      try{
        const rows=await priceRows("/api/recent",{"ctgry_cd::EQ":PRICE_CATEGORY,"item_cd::EQ":item.code},`main-facet-item|${item.code}`);
        if(rows.length)absorbPriceFacets(rows);
      }catch(e){}
      if((cache.mainUnits?.length||0)>=5&&(cache.mainSizes?.length||0)>=6)break;
    }
  }
  // 실제 가격응답이 없을 때도 공식 표준코드 API의 단위·크기 목록을 최종 fallback으로 사용한다.
  if(!(cache.mainUnits?.length)){const x=await priceStdUnitOptions();if(x.length)cache.mainUnits=x}
  if(!(cache.mainSizes?.length)){const x=await priceStdSizeOptions();if(x.length)cache.mainSizes=x}
  savePriceFacetCache();
}
function mainRows(q="",showAll=false){
  const query=showAll?"":q.trim().toLowerCase();
  const rows=[...mainActionRows(query)];
  const fishes=currentCatalog().filter(f=>!query||f.name.toLowerCase().includes(query)||String(f.code).includes(query));
  fishes.forEach(f=>rows.push({kind:"item",item:f.code,code:f.code,title:f.name,desc:`품목명 · ${f.code}`}));
  rows.push(...detailRows(query));
  rows.push(...auctionMainRows(query));
  return rows;
}
function renderMainSuggest(showAll=mainShowAll,skipRefresh=false){
  const rows=mainRows(mainInput.value,showAll);
  const groups=[
    ["가격·추세·지역·경매 기능",["group","intent"]],
    ["가격 · 품목명",["item"]],
    ["가격 · 유통단계",["stage"]],
    ["가격 · 품종/상태",["variety"]],
    ["가격 · 등급",["grade"]],
    ["가격 · 지역",["regionCode"]],
    ["가격 · 시장",["marketCode"]],
    ["경매 · 도매시장",["auctionMarket"]],
    ["경매 · 법인",["auctionCorp"]],
    ["경매 · 상품 대분류",["auctionLarge"]],
    ["경매 · 상품 중분류",["auctionMid"]],
    ["경매 · 상품 소분류",["auctionSmall"]]
  ];
  let html="";
  for(const [title,kinds] of groups){
    const section=rows.filter(r=>kinds.includes(r.kind));
    if(!section.length)continue;
    html+=`<div class="main-suggest-section">${esc(title)} (${section.length})</div>`;
    html+=section.map(r=>{
      if(r.kind==="group")return `<button type="button" class="main-suggest-item group" data-kind="group" data-group="${esc(r.group)}"><b>${esc(r.title)}</b><small>${esc(r.desc)}</small></button>`;
      if(r.kind==="intent")return `<button type="button" class="main-suggest-item" data-kind="intent" data-intent-index="${r.intentIndex}"><b>${esc(r.title)}</b><small>${esc(r.desc)}</small></button>`;
      const attrs=[
        `data-kind="${esc(r.kind)}"`,
        r.item?`data-item="${esc(r.item)}"`:"",
        r.vr?`data-vr="${esc(r.vr)}"`:"",
        r.region?`data-region="${esc(r.region)}"`:"",
        r.large?`data-large="${esc(r.large)}"`:"",
        r.mid?`data-mid="${esc(r.mid)}"`:"",
        r.market?`data-market="${esc(r.market)}"`:"",
        r.code?`data-code="${esc(r.code)}"`:""
      ].filter(Boolean).join(" ");
      return `<button type="button" class="main-suggest-item" ${attrs}><b>${esc(r.title)}</b><small>${esc(r.desc)}</small></button>`;
    }).join("");
  }
  mainList.innerHTML=html||`<div class="pick-empty">검색 결과가 없습니다.</div>`;

  mainList.querySelectorAll(".main-suggest-item").forEach(b=>b.addEventListener("click",ev=>{
    ev.preventDefault();ev.stopPropagation();
    const kind=b.dataset.kind;
    if(kind==="group"){closeMainSuggest();openGroup(b.dataset.group);return}
    if(kind==="intent"){
      const intent=INTENTS[Number(b.dataset.intentIndex)];if(!intent)return;
      nav.prefillItem=mainSelectedItem||DEFAULT_PRICE_ITEM;
      closeMainSuggest();nav.group=intent.group;openMenu(intent.menu);return;
    }
    const code=b.dataset.code||"";
    if(kind==="item"){
      const item=currentCatalog().find(f=>String(f.code)===String(code));if(!item)return;
      mainSelectedItem=item;nav.prefillItem=item;nav.prefillDetail={item:item.code,se:nav.prefillDetail?.se||"02"};
      mainInput.value=item.name;mainShowAll=true;renderMainSuggest(true,true);return;
    }
    if(kind==="stage"){
      nav.prefillDetail={...(nav.prefillDetail||{}),item:nav.prefillDetail?.item||mainSelectedItem.code,se:code};
      mainInput.value=`${mainSelectedItem.name} ${b.querySelector("b")?.textContent||""}`;renderMainSuggest(true,true);return;
    }
    if(kind==="variety"){
      const item=b.dataset.item||mainSelectedItem.code;
      const itemName=ITEM_NAME_BY_CODE.get(item)||mainSelectedItem.name;
      mainSelectedItem={code:item,name:itemName};nav.prefillItem=mainSelectedItem;
      nav.prefillDetail={...(nav.prefillDetail||{}),item,se:nav.prefillDetail?.se||"02",vr:code,gr:"",unit:"",size:""};
      mainInput.value=b.querySelector("b")?.textContent||itemName;renderMainSuggest(true,true);return;
    }
    if(kind==="grade"){
      const item=b.dataset.item||mainSelectedItem.code,vr=b.dataset.vr||"";
      const itemName=ITEM_NAME_BY_CODE.get(item)||mainSelectedItem.name;
      mainSelectedItem={code:item,name:itemName};nav.prefillItem=mainSelectedItem;
      nav.prefillDetail={...(nav.prefillDetail||{}),item,se:nav.prefillDetail?.se||"02",vr,gr:code,unit:"",size:""};
      mainInput.value=b.querySelector("b")?.textContent||itemName;renderMainSuggest(true,true);return;
    }
    if(kind==="regionCode"){
      nav.prefillDetail={...(nav.prefillDetail||{}),sgg:code,market:""};
      mainInput.value=`${codebookRegionName(code)} 가격`;renderMainSuggest(true,true);return;
    }
    if(kind==="marketCode"){
      nav.prefillDetail={...(nav.prefillDetail||{}),sgg:b.dataset.region||"",market:code};
      mainInput.value=`${codebookMarketName(code)} 가격`;renderMainSuggest(true,true);return;
    }
    if(kind==="auctionMarket"){
      nav.prefillAuction={...(nav.prefillAuction||{}),market:code,corp:""};
      const x=AUCTION_CODEBOOK.markets.find(v=>v.code===code);mainInput.value=`${x?.name||code} 실시간 경매`;renderMainSuggest(true,true);return;
    }
    if(kind==="auctionCorp"){
      nav.prefillAuction={...(nav.prefillAuction||{}),market:b.dataset.market||nav.prefillAuction?.market||"",corp:code};
      const x=AUCTION_CODEBOOK.corps.find(v=>v.code===code);mainInput.value=`${x?.name||code} 실시간 경매`;renderMainSuggest(true,true);return;
    }
    if(kind==="auctionLarge"){
      nav.prefillAuction={...(nav.prefillAuction||{}),large:code,mid:"",small:""};
      const x=AUCTION_CODEBOOK.large.find(v=>v.code===code);mainInput.value=`${x?.name||code} 실시간 경매`;renderMainSuggest(true,true);return;
    }
    if(kind==="auctionMid"){
      nav.prefillAuction={...(nav.prefillAuction||{}),large:b.dataset.large||"",mid:code,small:""};
      mainInput.value=`${b.querySelector("b")?.textContent||code} 실시간 경매`;renderMainSuggest(true,true);return;
    }
    if(kind==="auctionSmall"){
      nav.prefillAuction={...(nav.prefillAuction||{}),large:b.dataset.large||"",mid:b.dataset.mid||"",small:code};
      mainInput.value=`${b.querySelector("b")?.textContent||code} 실시간 경매`;renderMainSuggest(true,true);return;
    }
  }));

}
async function openMainSuggest(showAll=false){

  mainShowAll=showAll;
  mainSuggest.classList.add("on");
  mainDropBtn.classList.add("open");
  mainDropBtn.setAttribute("aria-expanded","true");
  renderMainSuggest(showAll,true);
  renderMainSuggest(showAll,true);
}
function closeMainSuggest(){
  mainSuggest.classList.remove("on");
  mainDropBtn.classList.remove("open");
  mainDropBtn.setAttribute("aria-expanded","false");
}
function closeMainLater(){
  if(mainCloseTimer)clearTimeout(mainCloseTimer);

}

document.getElementById("composer").onsubmit=async e=>{
  e.preventDefault();
  const t=mainInput.value.trim();if(!t)return;
  closeMainSuggest();
  const lower=t.toLowerCase();
  if(lower.includes("온라인")){add(esc(t),"user");nav.group="trade";openMenu("online")}
  else if(lower.includes("경매")||lower.includes("거래")){add(esc(t),"user");nav.group="trade";openMenu("auction")}
  else if(lower.includes("지역")){add(esc(t),"user");nav.group="region";openMenu("region")}
  else if(lower.includes("시장")){add(esc(t),"user");nav.group="region";openMenu("daily")}
  else if(lower.includes("추이")){add(esc(t),"user");nav.group="trend";openMenu("trend")}
  else if(lower.includes("등락")){add(esc(t),"user");nav.group="trend";openMenu("change")}
  else if(lower.includes("연월")){add(esc(t),"user");nav.group="price";openMenu("ym")}
  else if(lower.includes("소매")){add(esc(t),"user");nav.group="price";openMenu("prt")}
  else if(lower.includes("중도매")||lower.includes("도매")){add(esc(t),"user");nav.group="price";openMenu("pwh")}
  else{
    const item=await findPriceItemFromText(t);
    if(item){nav.prefillItem=item;await runItemOverview(item)}
    else{add(esc(t),"user");nav.group="price";openMenu("recent")}
  }
};

function enableInstallDrag(){const b=document.getElementById("installBtn");let drag=null;b.addEventListener("pointerdown",e=>{if(e.button!==undefined&&e.button!==0)return;const fr=phone.getBoundingClientRect(),br=b.getBoundingClientRect();drag={id:e.pointerId,x:e.clientX,y:e.clientY,left:br.left-fr.left,top:br.top-fr.top,moved:false};installWasDragged=false;b.setPointerCapture?.(e.pointerId);b.classList.add("dragging")});b.addEventListener("pointermove",e=>{if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.moved&&Math.hypot(dx,dy)<6)return;drag.moved=true;installWasDragged=true;e.preventDefault();const p=clampInstall(drag.left+dx,drag.top+dy);b.style.left=`${p.left}px`;b.style.top=`${p.top}px`;b.style.right="auto"});const finish=e=>{if(!drag||e.pointerId!==drag.id)return;b.classList.remove("dragging");if(drag.moved){try{localStorage.setItem(INSTALL_POS_KEY,JSON.stringify({left:parseFloat(b.style.left)||0,top:parseFloat(b.style.top)||0}))}catch(e){console.warn("[PWA] install position storage unavailable",e)}};try{b.releasePointerCapture?.(e.pointerId)}catch(_){}drag=null};b.addEventListener("pointerup",finish);b.addEventListener("pointercancel",finish);window.addEventListener("resize",()=>{if(!b.style.left)return;const p=clampInstall(parseFloat(b.style.left),parseFloat(b.style.top));b.style.left=`${p.left}px`;b.style.top=`${p.top}px`})}
async function installApp(){if(installWasDragged){installWasDragged=false;return}if(standalone())return;if(deferredInstallPrompt){deferredInstallPrompt.prompt();try{await deferredInstallPrompt.userChoice}catch(e){}deferredInstallPrompt=null;return}const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);add(`<h3>📲 앱 설치 안내</h3>${ios?"Safari의 공유 버튼을 누른 뒤 <b>홈 화면에 추가</b>를 선택하십시오.":"브라우저 메뉴(⋮)에서 <b>앱 설치</b> 또는 <b>홈 화면에 추가</b>를 선택하십시오."}`)}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstallPrompt=e});window.addEventListener("appinstalled",()=>{deferredInstallPrompt=null;document.getElementById("installBtn").classList.add("hidden")});document.getElementById("installBtn").onclick=installApp;

document.getElementById("fontBtn").onclick=()=>document.body.classList.toggle("big");
document.getElementById("settingsBtn").onclick=()=>{nav.group=null;nav.menu=null;nav.device=null;setSheet(`${head("설정·데이터 원칙")}<div class="hint"><b>버전 v0.17 · v4 품목 통합검색형</b><br><br>① API Key는 GitHub/HTML에 저장하지 않고 Cloudflare Worker Secret에서 관리합니다.<br>② 품목만 필수이며 유통단계·품종/상태·등급·지역·시장은 전체(자동)로 넓게 시작할 수 있습니다.<br>③ 정확조건이 0건이면 Worker v0.6이 품목코드를 고정한 채 등급 → 품종/상태 → 유통단계 → 필요 시 거래일/시장/지역을 단계적으로 확대합니다.<br>④ 자동확대가 발생하면 결과에 어떤 조건이 완화됐는지 반드시 표시합니다.<br>⑤ 어기·비어기는 검색 차단조건으로 사용하지 않고 결과 해석정보로만 사용합니다.<br>⑥ 단위·규격/단위크기는 선택조건에서 제외하고 실제 API 원자료 값을 결과에서 표시합니다.<br>⑦ 품목명만 입력하면 Worker v0.6의 /api/item-overview가 8개 가격 Endpoint를 자동탐색합니다.<br>⑧ 경매·온라인은 가격 API와 코드체계가 달라 별도 명칭대응 방식으로 추가 탐색합니다.<br>⑨ 0건과 API 오류를 구분하며 원자료를 임의 생성하지 않습니다.</div>`) };
